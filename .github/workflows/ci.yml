name: Tests et sécurité

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Installer et vérifier les poids PAD officiels
        if: matrix.python == '3.14'
        run: python -m scripts.download_pad
      - name: Vérifier les dépendances et les tests sans webcam
        run: |
          python -m pip check
          python -m unittest discover -s tests -v

  security:
    name: Sécurité du dépôt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Contrôler les fichiers suivis avant toute installation
        run: python scripts/check_repository.py
      - name: Installer les outils d'audit
        run: python -m pip install -r requirements-dev.txt
      - name: Chercher les vulnérabilités connues des dépendances
        run: python -m pip_audit --strict -r requirements.txt -r requirements-dev.txt
      - name: Analyser le code Python (gravité moyenne et haute)
        run: python -m bandit -r main.py gui.py recognition.py worker.py ui.py authentication.py liveness.py scripts qa -ll
